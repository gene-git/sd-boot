#
# /etc/sd-boot/config.yaml
#
# Config settings for installing kernels via sd-boot tools
# verb: verbosity level (0-3). Larger is more verbose:
#
#                          Errors   Normal  Verbose   "kernel-install -v"
#   0 = quiet              Y
#   1 = normal             Y        Y
#   2 = verbose            Y        Y       Y
#   3 = very verbose       Y        Y       Y         Y
#
# Level 3 passes the verboss flag to kernel-install.
#
verb: 1
skip_kernel_plugins: []
